# data_sample/property_b/inputs.sample.yaml
# Sample primary residence (Somerton role) - an owner-occupied home with a
# mortgage that refixed once. Mortgage on, rental tax OFF (you do not pay income
# tax on the home you live in), valuation on.
#
# Anonymised, real-shaped: the schedule SHAPE is real - contract dates, rates,
# term, the overpayment window, the month-end payment convention and the BOI
# profile are the real ones - while every euro amount (drawdown, instalments,
# overpayment, valuation) is an anonymised representative figure, not a real
# balance. No address, account number, name or real property name appears here.
# NEVER put real addresses, balances, or personal data in this file.
#
# Phase 11 / S1: migrated from the legacy month-number rate_blocks model to the
# date-based Loan + contracts schema (docs/contract_data_model.md Section A):
# two fixed contracts (B2 rolling into a B3 refix) then a variable tail (B4),
# a standing overpayment on B2 that ends at the refix, on the BOI lender profile.
# The engine derives month offsets from drawdown_date.

meta:
  property_id: property-b
  name: "Property B"
  kind: primary                     # owner-occupied: mortgage on, tax off, valuation on

loan:
  property_id: property-b
  lender: boi                       # resolves the BOI profile (Modified Following, ACT/365)
  drawdown_amount: 373696           # anonymised representative advance (not a real balance)
  drawdown_date: 2022-06-23         # loan start date (value date) at the BOI switch
  total_term_months: 420            # contractual term from the switch (35 years)
  property_value: 476000            # anonymised representative valuation (not the real figure)
  property_growth_pa: 0.025         # provisional LTV growth path (exact figure TBD)
  repayment_day: month_end          # BOI debits at month end; used only when no actual payment exists for a month
  first_payment_date: 2022-07-31    # first bank debit; anchors when the projected schedule begins
  overpayment_cap_pct: 0.10         # retired scalar (unused for any output); the real cap lives in the lender profile

  # Rate path as date-based contracts. A refix advances no new money, so it is a
  # new contract on the same loan. Each contract runs to the day before the next
  # starts (no gaps): B2 (fixed) -> B3 (fixed refix) -> B4 (variable tail).
  contracts:
    - id: B2
      start_date: 2022-06-23        # drawdown day
      end_date: 2026-06-23          # first fixed period end
      rate: 0.0190                  # first fixed rate
      rate_type: fixed
      instalment: 1218.82           # contractual monthly repayment (excludes standing extras)
      standing_overpayment:
        amount: 119.00              # voluntary monthly overpayment, merged into the debit
        start_date: 2025-07-31      # window opens
        end_date: 2026-06-30        # window closes at the B3 refix
        note: "voluntary overpay window; ends at the B3 refix"
    - id: B3
      start_date: 2026-06-24        # day after B2 ends (no gap)
      end_date: 2030-06-23          # second fixed period end
      rate: 0.0310                  # refixed fixed rate
      rate_type: fixed
      instalment: 1550.21           # recalculated contractual repayment at the refix
      # no standing overpayment on B3
    - id: B4
      start_date: 2030-06-24        # day after B3 ends (no gap)
      end_date: null                # open-ended variable tail to the end of term
      rate: 0.0350                  # indicative variable rate (real roll-to rate TBD)
      rate_type: variable
      instalment: null              # derive via PMT at the roll to variable

# When a new contract starts and there is no actual payment in that month:
#   RecalculatePayment -> compute a new PMT at the new rate over the remaining term
strategy_at_refix: RecalculatePayment

# No one-off lump sums on this residence.
lump_sums: []

# --- Optional, bank-specific behaviour ---
bank:
  day_count: ACT/365                        # Engine uses /365 today
  rounding_decimals: 2                      # Post interest rounded to 2 decimals
  merge_standing_extra_into_payment: true   # fold the overpayment into the debit during the window
  interest_posting_rule: actual_or_eom      # Use actual date when provided, else EOM

# --- Reconciliation tolerance / bank snapshots ---
# The committed sample ships an anonymised real bank feed (see actuals.sample.csv)
# plus one snapshot, so the golden also locks the reconcile path. Every euro figure
# is anonymised on the same single factor as the loan amounts. Real reconciliation
# still runs off the git-ignored data/property_b/ real feed.
reconcile:
  ok_abs_eur: 300.00                # rows are OK if |model - bank| <= EUR 300
  snapshots:
    - { date: 2025-12-31, balance: 345976.38 }   # anonymised bank balance (same factor as the feed)

# --- Optional, output knobs ---
output:
  write_excel: true
  write_csv: true
  include_daily_events: true
  currency: EUR
  locale: en_IE

# --- Modelling horizon ---
modelling:
  end_date: 2057-06-30              # ~420 months from drawdown
  day_count: ACT/365                # informational; the engine uses /365

# --- Irish tax: OFF for an owner-occupied home ---
tax:
  enabled: false
  jurisdiction: IE