# data_sample/property_a/inputs.sample.yaml
# Sample investment property - realistic Irish BTL mortgage, fully fictitious values.
# NEVER put real addresses, balances, or personal data here.
#
# Phase 10 / S2: migrated to the date-based Loan + contracts schema
# (docs/contract_data_model.md Section A). The three legacy rate_blocks become
# three contracts (a refix is a new contract on the same loan); known_first_payment
# is the first contract's instalment; overpay_rules become the first contract's
# standing_overpayment; the payment break moves to a contract payment_event
# (parsed, not yet applied, exactly as the old bank.payment_holidays block was).
# The engine derives month offsets from drawdown_date, so the schedule is
# byte-identical to the pre-migration rate_blocks model.

meta:
  property_id: property-a
  name: "Property A"
  kind: investment

loan:
  property_id: property-a
  lender: boi
  drawdown_amount: 495000           # New money advanced on drawdown day (was principal_at_drawdown)
  drawdown_date: 2024-03-26         # Loan start date (value date)
  total_term_months: 420            # Original contractual term
  property_value: 550000            # For LTV analytics and sell scenarios (was property_price)
  property_growth_pa: 0.03          # Simple growth path for LTV (optional)
  repayment_day: 5                  # Projected payment day; used only when no bank payment exists for a month
  first_payment_date: 2024-08-14    # First bank debit; anchors when the projected schedule begins
  overpayment_cap_pct: 0.10         # Retired scalar (unused for any output); moves into the lender profile in S3

  # If property revaluation blocks are needed, uncomment and edit below
  #valuation_blocks:
    #- { start: 2028-04-01, value: 600000, growth_pa: 0.01 }
    #- { start: 2032-04-01, value: 640000, growth_pa: 0.02 }

  # Rate path as date-based contracts (a refix advances no new money, so it is a
  # new contract on the same loan). start/end dates reproduce the legacy month
  # windows exactly: months 1-48, 49-97, 98+ counted from drawdown.
  contracts:
    - id: A1
      start_date: 2024-03-26        # month 1
      end_date: 2028-02-29          # month 48
      rate: 0.0365
      rate_type: fixed
      instalment: 2123.44           # known first payment (contractual PMT excl. standing extras)
      standing_overpayment:
        amount: 200.0               # was overpay_rules: +200/month from month 17
        start_date: 2025-07-01      # month 17
        end_date: null              # open-ended: runs to the end of term
        note: "standing monthly overpayment from month 17"
      payment_events:
        - type: payment_holiday     # parsed and deferred (not applied); activation is the S4 re-baseline
          start_date: 2024-03-26
          end_date: 2024-07-31
          treatment: interest_only
          note: "interest-only break; capitalises. Deferred: the no-payment window today is set by first_payment_date."
    - id: A2
      start_date: 2028-03-01        # month 49
      end_date: 2032-03-31          # month 97
      rate: 0.0475
      rate_type: fixed
      instalment: null              # derive via PMT at the refix (RecalculatePayment)
    - id: A3
      start_date: 2032-04-01        # month 98
      end_date: null                # open-ended variable tail
      rate: 0.0400
      rate_type: variable
      instalment: null              # derive via PMT at the refix (RecalculatePayment)

# When a new contract starts and there is no actual payment in that month:
#   RecalculatePayment -> compute new PMT at the new rate over the remaining term
strategy_at_refix: RecalculatePayment

# --- Optional, bank-specific behaviour ---
bank:
  day_count: ACT/365                # Engine uses /365 today; can extend to ACT/360, ACT/365F
  rounding_decimals: 2              # Post interest rounded to 2 decimals
  merge_standing_extra_into_payment: true   # auto|true|false (must stay 'true' to match the golden)
  interest_posting_rule: actual_or_eom      # Use actual date when provided, else EOM

# --- BOI screenshot for reconciliation ---
reconcile:
  ok_abs_eur: 300.00   # rows are OK if |model - bank| <= EUR300
  snapshots:
    - { date: 2025-10-10, balance: 489826.81 }
    - { date: 2025-11-06, balance: 489023.00 }
    - { date: 2026-06-15, balance: 483079.15 }

# --- Optional, output knobs ---
output:
  write_excel: true
  write_csv: true
  include_daily_events: true
  currency: EUR
  locale: en_IE

# --- Modelling horizon ---
modelling:
  end_date: 2059-04-05
  day_count: ACT/365                 # informational; the engine uses /365

# --- Irish tax settings (Form 11; reporting-only) ---
tax:
  enabled: true
  jurisdiction: IE
  tenancy_file: tenancy.local.yaml
  use_posting_date_for_year: true    # Allocate interest to the year of posting (default)
  deductible_percentage_by_year:
    default: 1.00                     # 1.00 = 100% deductible
  deductible_windows: []              # e.g. [ { start: 2025-01-01, end: 2025-12-31 } ]
  audit:
    write_monthly: true               # write a month-level audit sheet/CSV